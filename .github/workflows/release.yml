name: build and release ipk

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: derive version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "ver=${GITHUB_REF#refs/tags/v}-1" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=1.0.0-0$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "tag=v1.0.0-1" >> "$GITHUB_OUTPUT"
          fi

      - name: build ipk
        run: sh build/build-ipk.sh "${{ steps.ver.outputs.ver }}"

      - name: smoke test archive
        run: |
          cd dist
          bash -n ../build/build-ipk.sh && echo "build script syntax OK"
          ipk="luci-app-sssplit_all.ipk"
          # modern ipk = gzip'd tar with ./debian-binary, ./control.tar.gz, ./data.tar.gz
          python3 - "$ipk" <<'PYEOF'
          import sys, tarfile
          p = sys.argv[1]
          want = {'./debian-binary', './control.tar.gz', './data.tar.gz'}
          with tarfile.open(p, 'r:gz') as t:
              names = {m.name for m in t.getmembers()}
              assert names == want, names
              t.extract('./control.tar.gz', '.')
              t.extract('./data.tar.gz', '.')
          print('ipk members OK:', ', '.join(sorted(names)))
          PYEOF
          tar -tzf control.tar.gz | grep -qE '^\./control$'
          tar -tzf data.tar.gz   | grep -qE '^\./usr/bin/sssplit-ctl$'
          tar -xzOf data.tar.gz ./usr/bin/sssplit-ctl | sh -n && echo "ctl syntax OK"
          tar -xzOf control.tar.gz ./postinst | sh -n && echo "postinst syntax OK"

      - name: create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
              --title "${{ steps.ver.outputs.tag }}" \
              --generate-notes \
              dist/luci-app-sssplit_${{ steps.ver.outputs.ver }}_all.ipk \
          || ( gh release upload "${{ steps.ver.outputs.tag }}" --clobber \
               dist/luci-app-sssplit_${{ steps.ver.outputs.ver }}_all.ipk )
          # keep stable filename for install.sh (releases/latest/download/luci-app-sssplit_all.ipk)
          cp dist/luci-app-sssplit_${{ steps.ver.outputs.ver }}_all.ipk dist/luci-app-sssplit_all.ipk
          gh release upload "${{ steps.ver.outputs.tag }}" --clobber dist/luci-app-sssplit_all.ipk
          # ship engine ipk assets in every release (ctl/install.sh reference
          # them via releases/latest/download/...):
          #  - sslocal: passwall2 now bundles ipks in zips, re-host ours here
          #  - ipt2socks: not in the stock OpenWrt feeds at all
          pwtag=$(curl -sq https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "passwall2 latest: $pwtag"
          curl -sL -o /tmp/pw.zip "https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/download/${pwtag}/packages_ipk_mipsel_24kc.zip" || true
          python3 - <<'PYEOF'
          import zipfile
          with zipfile.ZipFile('/tmp/pw.zip') as z:
              n = [x for x in z.namelist() if 'sslocal' in x][0]
              z.extract(n, '/tmp')
          import shutil, glob
          src = glob.glob('/tmp/**/shadowsocks-rust-sslocal*', recursive=True)[0]
          shutil.move(src, '/tmp/sslocal-1.25.0-r1_mipsel_24kc.ipk')
          print('sslocal ipk extracted')
          PYEOF
          IPT2SOCKS_URL="https://github.com/kenzok8/small/releases/download/18-mipsel_24kc-24.10.5/ipt2socks_1.1.4-r3_mipsel_24kc.ipk"
          curl -sL -o /tmp/ipt2socks-1.1.4-r3_mipsel_24kc.ipk "$IPT2SOCKS_URL" || true
          # optional ssr engine bits (not in stock feeds either)
          for f in shadowsocksr-libev-ssr-redir_2.5.10-r1_mipsel_24kc.ipk \
                   shadowsocksr-libev-ssr-server_2.5.10-r1_mipsel_24kc.ipk; do
              curl -sL -o "/tmp/$f" "https://github.com/kenzok8/small/releases/download/18-mipsel_24kc-24.10.5/$f" || true
          done
          # stock-feed packages: https-dns-proxy (required) + its luci app
          curl -sL -o /tmp/https-dns-proxy_2026.05.06-r1_mipsel_24kc.ipk \
              "https://downloads.openwrt.org/releases/24.10.0/packages/mipsel_24kc/packages/https-dns-proxy_2026.05.06-r1_mipsel_24kc.ipk" || true
          curl -sL -o /tmp/luci-app-https-dns-proxy_2026.05.06-r1_all.ipk \
              "https://downloads.openwrt.org/releases/24.10.0/packages/mipsel_24kc/luci/luci-app-https-dns-proxy_2026.05.06-r1_all.ipk" || true
          for a in /tmp/sslocal-1.25.0-r1_mipsel_24kc.ipk /tmp/ipt2socks-1.1.4-r3_mipsel_24kc.ipk \
                   /tmp/shadowsocksr-libev-ssr-redir_2.5.10-r1_mipsel_24kc.ipk \
                   /tmp/shadowsocksr-libev-ssr-server_2.5.10-r1_mipsel_24kc.ipk \
                   /tmp/https-dns-proxy_2026.05.06-r1_mipsel_24kc.ipk \
                   /tmp/luci-app-https-dns-proxy_2026.05.06-r1_all.ipk; do
              if [ -s "$a" ]; then
                  gh release upload "${{ steps.ver.outputs.tag }}" --clobber "$a" && echo "uploaded $a" \
                  || echo "WARN: could not upload $a"
              else
                  echo "WARN: $a missing, skipped"
              fi
          done
